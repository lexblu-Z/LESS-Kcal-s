<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="LESS-Kcal-s: Sistema completo de controle alimentar e calorias com cálculo automático TACO/TBCA e IA." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>LESS-Kcal-s — Controle Alimentar Inteligente</title>
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black dark:bg-[#09090B] text-zinc-900 dark:text-zinc-100 min-h-screen selection:bg-brand-500 selection:text-white font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro do Service Worker PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ PWA Service Worker registrado:', reg.scope))
            .catch((err) => console.log('PWA SW registro opcional:', err));
        });
      }
    </script>
  </body>
</html>
